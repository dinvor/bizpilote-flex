<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizpilote Flex Play</title>

  <link rel="stylesheet" href="bizpilote-flex.min.css">

  <style>
    body { font-family: system-ui, sans-serif; background: var(--bp-dark); color: var(--bp-light); padding: 16px; }
    textarea { width: 100%; height: 120px; margin-bottom: 16px; }
    #preview { border: 1px solid var(--bp-gray); border-radius: var(--bp-radius); padding: 16px; min-height: 120px; }
  </style>
</head>
<body>

  <h1 class="text-primary">Bizpilote Flex Play</h1>
  <p>Teste les classes en live.</p>

  <textarea id="code">&lt;div class="flex row gap-md"&gt;
  &lt;div class="card basis-1-3 sm-full"&gt;Bloc 1&lt;/div&gt;
  &lt;div class="card basis-1-3 sm-full"&gt;Bloc 2&lt;/div&gt;
  &lt;div class="card basis-1-3 sm-full"&gt;Bloc 3&lt;/div&gt;
&lt;/div&gt;</textarea>

  <button class="btn btn-primary" onclick="updatePreview()">Run</button>

  <div id="preview"></div>

  <script src="script.js"></script>
  <script>
    function updatePreview() {
      const code = document.getElementById('code').value;
      document.getElementById('preview').innerHTML = code;
    }
    updatePreview();
  </script>
</body>
</html>
